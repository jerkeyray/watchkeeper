name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      WK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SIM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/simulator_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: true
      - run: make fmt-check
      - run: make vet
      - run: DATABASE_URL="$WK_TEST_DATABASE_URL" go run ./cmd/migrate -dir migrations/watchkeeper
      - run: psql "$WK_TEST_DATABASE_URL" -c "CREATE DATABASE simulator_test"
      - run: make test-race
      - run: make build
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make smoke-all
      - if: always()
        run: make compose-down

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
      - run: BENCH_PROJECT=watchkeeper-benchmark-ci ./scripts/benchmark.sh run benchmarks/smoke.json ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-benchmark-smoke
          path: results/ci-smoke
      - if: always()
        run: docker compose -p watchkeeper-benchmark-ci -f deploy/benchmark/compose.yaml down
